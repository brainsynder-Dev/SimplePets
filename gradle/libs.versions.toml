[versions]
latestspigot = "1.21.11-R0.1-SNAPSHOT"

# Libraries
bstats-version = "3.1.0"
updatechecker-version = "3.0.5-CUSTOM"
protocollib-version = "5.3.0"
placeholderapi-version = "2.11.6"
commons-io-version = "2.11.0"

pluginutils-version = "0.1.41"
# brigadier-version = "1.3.10"
# commandapi-version = "10.1.2"

# Plugins
hangar-version = "0.0.5" # hangar plugin is not used yet...
shadow-version = "9.0.0-beta8"
paperweight-version = "2.0.0-beta.21"
spigotweight-version = "1.0.9-SNAPSHOT"

[libraries]
spigotapi = { module = "org.spigotmc:spigot-api", version.ref = "latestspigot" }

bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats-version" }
updatechecker = { module = "com.jeff_media:SpigotUpdateChecker", version.ref = "updatechecker-version" }
protocollib = { module = "com.comphenix.protocol:ProtocolLib", version.ref = "protocollib-version" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi-version" }
commonsio = { module = "commons-io:commons-io", version.ref = "commons-io-version" }

pluginutils = { module = "org.bsdevelopment.pluginutils:BSPluginUtils", version.ref = "pluginutils-version" }
# brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier-version" }
# commandapi = { module = "dev.jorel:commandapi-bukkit-shade", version.ref = "commandapi-version" }

[plugins]
hangar = { id = "io.papermc.hangar-publish-plugin", version.ref = "hangar-version" } # hangar plugin is not used yet...
shadow = { id = "com.gradleup.shadow", version.ref = "shadow-version" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-version" }
spigotweight = { id = "org.bsdevelopment.spigotweight.userdev", version.ref = "spigotweight-version" }